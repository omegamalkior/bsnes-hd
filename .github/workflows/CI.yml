name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  Windows:
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Build
      run: mingw32-make -j $env:NUMBER_OF_PROCESSORS -C bsnes
    - name: Prepare artifacts
      run: |
        cp -R pack bsnes\out\
        cp README.md bsnes\out\pack
        cp bsnes\out\bsnes.exe bsnes\out\pack\bsnes_hd.exe
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bsnes_hd_10-7-0_windows
        path: bsnes\out\pack
        if-no-files-found: error

  Windows-libretro:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Build
      run: mingw32-make -j $env:NUMBER_OF_PROCESSORS -C bsnes target=libretro
    - name: Prepare artifacts
      shell: bash
      run: |
        mkdir -p bsnes/out/pack
        cp README.md LICENSE bsnes/target-libretro/bsnes_hd_10-7-0_libretro.info bsnes/out/pack
        cp -R bsnes/out/*bsnes_hd_10-7-0_libretro* bsnes/out/pack
    - name: Publish core to builds branch
      if: github.ref == 'refs/heads/super-metroid-widescreen'
      shell: bash
      run: |
        mkdir pub
        cp bsnes/out/bsnes_hd_10-7-0_libretro.dll pub/
        strip --strip-unneeded pub/bsnes_hd_10-7-0_libretro.dll
        # build the headless test tool and check that the finished core loads and starts on Windows
        gcc -O2 -static -o pub/smwide-bench.exe tools/smwide-bench/bench.c
        ./pub/smwide-bench.exe pub/bsnes_hd_10-7-0_libretro.dll --smoke
        cd pub
        git init -q -b builds
        git config user.name "github-actions"
        git config user.email "github-actions@users.noreply.github.com"
        git add .
        git commit -q -m "Windows libretro core built from ${GITHUB_SHA}"
        git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bsnes_hd_10-7-0_windows_libretro
        path: bsnes\out\pack
        if-no-files-found: error

  Linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup
      run: |
        sudo apt-get update
        sudo apt-get -y install build-essential libgtk2.0-dev libpulse-dev mesa-common-dev libcairo2-dev libsdl2-dev libxv-dev libao-dev libopenal-dev libudev-dev
    - name: Build
      run: make -j $(nproc) -C bsnes
    - name: Prepare artifacts
      run: |
        cp -R pack bsnes/out/
        cp README.md bsnes/out/pack/readme.md
        cp bsnes/out/bsnes bsnes/out/pack/bsnes_hd
        chmod +x bsnes/out/pack/bsnes_hd
        mkdir -p bsnes/out/tar
        cd bsnes/out/pack
        tar -jcvpf ../tar/bsnes_hd_10-7-0_linux.tar.bz2 *
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: UNPACK-LINUX
        path: bsnes/out/tar
        if-no-files-found: error

  Linux-libretro:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup
      run: |
        sudo apt-get update
        sudo apt-get -y install build-essential libgtk2.0-dev libpulse-dev mesa-common-dev libcairo2-dev libsdl2-dev libxv-dev libao-dev libopenal-dev libudev-dev
    - name: Build
      run: make -j $(nproc) -C bsnes target=libretro
    - name: Prepare artifacts
      run: |
        mkdir -p bsnes/out/pack
        cp README.md LICENSE bsnes/target-libretro/bsnes_hd_10-7-0_libretro.info bsnes/out/pack
        cp -R bsnes/out/*bsnes_hd_10-7-0_libretro* bsnes/out/pack
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bsnes_hd_10-7-0_linux_libretro
        path: bsnes/out/pack
        if-no-files-found: error

  Linux-ARM-libretro:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: add foreign arch
      run: |
        sudo dpkg --add-architecture arm64
        sudo rm -rf /etc/apt/sources.list
        echo "deb [arch=amd64] http://us.archive.ubuntu.com/ubuntu focal main restricted" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=amd64] http://us.archive.ubuntu.com/ubuntu focal-updates main restricted" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=amd64] http://us.archive.ubuntu.com/ubuntu focal universe" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=amd64] http://us.archive.ubuntu.com/ubuntu focal-updates universe" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=amd64] http://us.archive.ubuntu.com/ubuntu focal multiverse" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=amd64] http://us.archive.ubuntu.com/ubuntu focal-updates multiverse" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=amd64] http://us.archive.ubuntu.com/ubuntu focal-backports main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main restricted" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main restricted" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal universe" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates universe" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal multiverse" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates multiverse" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-backports main restricted universe multiverse"  | sudo tee -a /etc/apt/sources.list
    - name: Install needed packages
      run: sudo apt update && sudo apt install wget:amd64 git:amd64 build-essential:amd64 gcc:amd64 make:amd64 g++-aarch64-linux-gnu:amd64 gcc-aarch64-linux-gnu:amd64 binutils-aarch64-linux-gnu:amd64 libx11-dev:arm64 libxext-dev:arm64
    - name: Build
      run: |
        make -j $(nproc) -C bsnes target=libretro compiler=/usr/bin/aarch64-linux-gnu-g++
        wget https://raw.githubusercontent.com/libretro/libretro-super/master/retrolink.sh && chmod +x retrolink.sh && ./retrolink.sh bsnes/out/bsnes_hd_10-7-0_libretro.so
    - name: Prepare artifacts
      run: |
        mkdir -p bsnes/out/pack
        cp README.md LICENSE bsnes/target-libretro/bsnes_hd_10-7-0_libretro.info bsnes/out/pack
        cp -R bsnes/out/*bsnes_hd_10-7-0_libretro* bsnes/out/pack
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bsnes_hd_10-7-0_linux_arm_libretro
        path: bsnes/out/pack
        if-no-files-found: error

  macOS:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Build
      run: |
        export MACOSX_DEPLOYMENT_TARGET=10.14
        make -j $(getconf _NPROCESSORS_ONLN) -C bsnes
    - name: Prepare artifacts
      run: |
        mkdir -p bsnes/out/pack
        cp LICENSE README.md bsnes/out/pack
        cp -R bsnes/out/*bsnes* bsnes/out/pack
        mv bsnes/out/pack/bsnes.app bsnes/out/pack/bsnes_hd.app
        chmod +x bsnes/out/pack/bsnes_hd.app/Contents/MacOS/bsnes
        mkdir -p bsnes/out/tar
        cd bsnes/out/pack
        tar -jcvpf ../tar/bsnes_hd_10-7-0_mac.tar.bz2 *
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: UNPACK-MAC
        path: bsnes/out/tar
        if-no-files-found: error

  macOS-libretro:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Build
      run: |
        export MACOSX_DEPLOYMENT_TARGET=10.14
        make -j $(getconf _NPROCESSORS_ONLN) -C bsnes target=libretro
    - name: Prepare artifacts
      run: |
        mkdir -p bsnes/out/pack
        cp README.md LICENSE bsnes/target-libretro/bsnes_hd_10-7-0_libretro.info bsnes/out/pack
        cp -R bsnes/out/*bsnes_hd_10-7-0_libretro* bsnes/out/pack
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bsnes_hd_10-7-0_mac_libretro
        path: bsnes/out/pack
        if-no-files-found: error

  Android-libretro:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: nttld/setup-ndk@v1
      with:
        ndk-version: r20b
    - name: Build
      run: |
        cd bsnes/target-libretro/jni
        ndk-build
        cd -
        for f in bsnes/target-libretro/libs/*/libretro.so; do mv "$f" "$(dirname "$f")/bsnes_hd_10-7-0_libretro_android.so"; done
        cp README.md LICENSE bsnes/target-libretro/bsnes_hd_10-7-0_libretro.info bsnes/target-libretro/libs
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bsnes_hd_10-7-0_android_libretro
        path: bsnes/target-libretro/libs
        if-no-files-found: error

  Nintendo-3DS-libretro:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
    - uses: actions/checkout@v4
    - name: Build core
      run: make -j $(nproc) -C bsnes/target-libretro/ctr
    - name: Build RetroArch for 3DS with the core
      run: |
        # the 3DS has no loadable cores: each core is a RetroArch build with the core linked in
        git init -q ra && cd ra
        git fetch -q --depth 1 https://github.com/libretro/RetroArch.git d78199ff8590f7dfd0efac9c32fd7a4984e7752a
        git checkout -q FETCH_HEAD
        cp ../bsnes/target-libretro/ctr/bsnes_hd_10-7-0_libretro_ctr.a libretro_ctr.a
        make -f Makefile.ctr -j $(nproc) USE_CTRULIB_2=1 LIBRETRO=bsnes_hd_10-7-0 APP_TITLE="bsnes-hd 10.7.0" \
          APP_PRODUCT_CODE=RARCH-BSNESHD APP_UNIQUE_ID=0xBAF10 APP_AUTHOR="bsnes-hd (unofficial 10.7.0)"
        mkdir -p ../pack3ds
        cp retroarch_3ds.3dsx ../pack3ds/bsnes_hd_10-7-0_libretro.3dsx
        cp retroarch_3ds.cia ../pack3ds/bsnes_hd_10-7-0_libretro.cia
        cp ../README.md ../LICENSE ../pack3ds/
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bsnes_hd_10-7-0_3ds_libretro
        path: pack3ds
        if-no-files-found: error

  Release:
    if: startsWith(github.ref, 'refs/tags/v10.7.0')
    needs: [Windows-libretro, Linux-libretro, Linux-ARM-libretro, macOS-libretro, Android-libretro, Nintendo-3DS-libretro]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      TITLE: "bsnes-hd 10.7.0 (aspect ratio no ROM patching, up to 32:9)"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: art
        pattern: bsnes_hd_10-7-0_*_libretro
    - name: Package
      run: |
        mkdir dist
        for d in art/*; do (cd "$d" && zip -qr "../../dist/$(basename "$d").zip" .); done
        ls -la dist
    - name: Create or rename the release
      run: |
        # an existing release (also a draft) is renamed and moved to this tag; otherwise one is made
        gh release list --limit 20 --json tagName,isDraft,name | tee releases.json
        existing=$(jq -r 'if length == 1 then .[0].tagName else "" end' releases.json)
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release edit "$TAG" --title "$TITLE" --notes-file tools/release-notes-10.7.0.md
        elif [ -n "$existing" ]; then
          gh release edit "$existing" --tag "$TAG" --title "$TITLE" --notes-file tools/release-notes-10.7.0.md
        else
          gh release create "$TAG" --title "$TITLE" --notes-file tools/release-notes-10.7.0.md
        fi
        gh release upload "$TAG" dist/*.zip --clobber
        gh release view "$TAG"
